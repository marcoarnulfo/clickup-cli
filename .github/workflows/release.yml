name: release

# Tag-driven releases: push a v* tag and this workflow runs the test suite,
# extracts the tag's section from CHANGELOG.md into the release notes, and
# lets GoReleaser publish binaries, signed checksums and the package-manager
# manifests. Prerelease tags (vX.Y.Z-rcN) smoke-test the whole pipeline:
# skip_upload: auto in .goreleaser.yaml keeps them off the package managers.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the GitHub release and upload artifacts
  id-token: write # cosign keyless signing via GitHub OIDC

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - run: go vet ./...
      - run: go test ./... -race

      # The release notes are the tag's CHANGELOG.md section. A missing
      # section fails the release here, before anything is published.
      - name: Extract release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          # A prerelease tag (vX.Y.Z-rcN) exists to exercise this pipeline, not
          # to describe a different set of changes, so it reads the base
          # version's section. Without this the documented rc smoke test cannot
          # run at all: the extraction below would find no
          # '## [X.Y.Z-rcN]' heading and fail the release before publishing.
          version="${version%%-*}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found=1; next }
            /^## \[/ && found { exit }
            found
          # Written outside the checkout: goreleaser refuses to release from a
          # dirty tree, and an untracked notes.md in the repo root is dirty.
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "::error::CHANGELOG.md has no '## [$version]' section"
            exit 1
          fi

      # Pinned to an exact tag on purpose: sigstore/cosign-installer publishes
      # floating v2 and v3 refs but NO floating v4, so '@v4' does not resolve
      # and the job dies before anything runs. The v4 line is the one that
      # installs cosign v3, which is what .goreleaser.yaml's
      # 'sign-blob --bundle' needs.
      - uses: sigstore/cosign-installer@v4.1.2

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --release-notes=${{ runner.temp }}/notes.md
        env:
          # Release the tag that triggered this run, not whatever `git describe`
          # picks. When a release tag and its rc sit on the same commit — which
          # is the normal shape of the documented smoke test — describe can
          # resolve to the rc, and the run publishes rc artifacts under the
          # release tag's name.
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Personal access token with contents:write on homebrew-tap and
          # scoop-bucket (GITHUB_TOKEN cannot push to other repos).
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          # SSH private key registered on aur.archlinux.org. Optional: the
          # aurs section disables itself while this is empty.
          AUR_KEY: ${{ secrets.AUR_KEY }}
